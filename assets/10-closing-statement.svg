<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><style>@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
