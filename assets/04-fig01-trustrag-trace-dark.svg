<svg xmlns="http://www.w3.org/2000/svg" role="img" width="840" height="176" viewBox="0 0 840 176">
  <title>FIG 03 — TrustRAG 8-Stage Verification Trace (Dark)</title>
  <style>
    @keyframes flow { to { stroke-dashoffset: -16; } }
    .edge { stroke-dasharray: 4 4; animation: flow 1.4s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .edge { animation: none !important; } }
  </style>
  <rect width="840" height="176" rx="10" fill="#0D1016" stroke="#202634" stroke-width="1"/>
  <text x="20" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.8" fill="#60A5FA">FIG 03 · TRUSTRAG 8-STAGE VERIFICATION TRACE</text>
  <text x="820" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#848D9C" text-anchor="end">OFFLINE DEFAULT · P95 &lt; 300MS</text>
  <line x1="20" y1="38" x2="820" y2="38" stroke="#202634" stroke-width="1"/>

  <rect x="20" y="54" width="180" height="100" rx="8" fill="#11141B" stroke="#202634" stroke-width="1"/>
  <text x="34" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#848D9C">01–02 // ROUTE + RRF</text>
  <text x="34" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F4F2ED">Deterministic Route</text>
  <text x="34" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#A1A8B5">ONNX BGE-small + BM25</text>
  <text x="34" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#60A5FA">0 LLM routing calls</text>

  <line x1="202" y1="104" x2="224" y2="104" stroke="#3B82F6" stroke-width="1.5" class="edge"/>
  <polygon points="222,100 228,104 222,108" fill="#60A5FA"/>

  <rect x="230" y="54" width="180" height="100" rx="8" fill="#11141B" stroke="#202634" stroke-width="1"/>
  <text x="244" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#848D9C">03–04 // CITE + SPLIT</text>
  <text x="244" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F4F2ED">Atomic Claims</text>
  <text x="244" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#A1A8B5">Cited draft decomposed</text>
  <text x="244" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#60A5FA">Fused NLI (−62% calls)</text>

  <line x1="412" y1="104" x2="434" y2="104" stroke="#3B82F6" stroke-width="1.5" class="edge"/>
  <polygon points="432,100 438,104 432,108" fill="#60A5FA"/>

  <rect x="440" y="54" width="180" height="100" rx="8" fill="#11141B" stroke="#202634" stroke-width="1"/>
  <text x="454" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#848D9C">05–06 // NLI + AUDIT</text>
  <text x="454" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F4F2ED">SHA-256 + Temporal</text>
  <text x="454" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#A1A8B5">Evidence hash check</text>
  <text x="454" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#60A5FA">Score vs τ ≥ 0.75</text>

  <line x1="622" y1="104" x2="644" y2="104" stroke="#3B82F6" stroke-width="1.5" class="edge"/>
  <polygon points="642,100 648,104 642,108" fill="#60A5FA"/>

  <rect x="650" y="54" width="170" height="100" rx="8" fill="#141821" stroke="#334155" stroke-width="1"/>
  <text x="664" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#848D9C">07–08 // VERDICT</text>
  <text x="664" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F4F2ED">Recover or Halt</text>
  <text x="664" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#A1A8B5">≤2 LangGraph retries</text>
  <rect x="664" y="124" width="66" height="20" rx="4" fill="#162136" stroke="#253C5A" stroke-width="1"/>
  <text x="697" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">ANSWER</text>
  <rect x="736" y="124" width="68" height="20" rx="4" fill="#2A1519" stroke="#5C242B" stroke-width="1"/>
  <text x="770" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#FCA5A5" text-anchor="middle">ABSTAIN</text>
</svg>
