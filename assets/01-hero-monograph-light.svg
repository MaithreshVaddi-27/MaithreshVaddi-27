<svg xmlns="http://www.w3.org/2000/svg" role="img" width="840" height="316" viewBox="0 0 840 316">
  <title>Maithresh Vaddi — Verifiable AI systems, built from first principles (Light)</title>
  <style>
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .a1 { animation: fadeUp 0.28s cubic-bezier(.16,1,.3,1) both; }
    .a2 { animation: fadeUp 0.28s cubic-bezier(.16,1,.3,1) 0.08s both; }
    .a3 { animation: fadeUp 0.28s cubic-bezier(.16,1,.3,1) 0.16s both; }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .a1, .a2, .a3 { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
  <defs>
    <pattern id="gridL1" width="28" height="28" patternUnits="userSpaceOnUse">
