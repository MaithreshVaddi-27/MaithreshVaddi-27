    <text x="24" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#374151">Final-year B.Tech CSE @ KMIT (7.96 CGPA). Building local-first RAG</text>
