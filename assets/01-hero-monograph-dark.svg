<svg xmlns="http://www.w3.org/2000/svg" role="img" width="840" height="316" viewBox="0 0 840 316">
  <title>Maithresh Vaddi — Verifiable AI systems, built from first principles (Dark)</title>
  <style>
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .a1 { animation: fadeUp 0.28s cubic-bezier(.16,1,.3,1) both; }
    .a2 { animation: fadeUp 0.28s cubic-bezier(.16,1,.3,1) 0.08s both; }
    .a3 { animation: fadeUp 0.28s cubic-bezier(.16,1,.3,1) 0.16s both; }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .a1, .a2, .a3 { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="bgD1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1017"/>
      <stop offset="1" stop-color="#0B0D11"/>
    </linearGradient>
    <pattern id="gridD1" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#181F2C" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="840" height="316" rx="12" fill="url(#bgD1)"/>
  <rect width="840" height="316" rx="12" fill="url(#gridD1)" opacity="0.65"/>
  <rect x="0.5" y="0.5" width="839" height="315" rx="12" fill="none" stroke="#202634" stroke-width="1"/>

  <!-- Top Header -->
  <rect x="24" y="20" width="22" height="22" rx="4" fill="#141821" stroke="#334155" stroke-width="1"/>
  <path d="M29 36 V26 L35 32 L41 26 V36" fill="none" stroke="#F4F2ED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="56" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#A1A8B5">~/maithresh</text>

  <rect x="614" y="19" width="202" height="24" rx="12" fill="#141821" stroke="#202634" stroke-width="1"/>
  <circle cx="628" cy="31" r="3.5" fill="#60A5FA" class="pulse"/>
  <text x="639" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#CBD5E1">OPEN · AI/ML INTERNSHIPS</text>

  <line x1="24" y1="54" x2="816" y2="54" stroke="#202634" stroke-width="1"/>

  <!-- Left Editorial Manifesto -->
  <g class="a1">
    <text x="24" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" letter-spacing="-0.8" fill="#F4F2ED">Verifiable AI systems,</text>
    <text x="24" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic" font-weight="400" letter-spacing="-0.8" fill="#60A5FA">built from first principles.</text>
  </g>

  <g class="a2">
    <text x="24" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#A1A8B5">Maithresh Vaddi  ·  AI/ML &amp; Backend Engineer  ·  Hyderabad, IN</text>
    <text x="24" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#B8BFCC">Final-year B.Tech CSE @ KMIT (7.96 CGPA). Building local-first RAG</text>
    <text x="24" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#B8BFCC">verification pipelines, MCP tool servers, and deterministic backends</text>
    <text x="24" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#B8BFCC">where models only reason and every claim stays traceable.</text>
  </g>

  <g class="a3">
    <rect x="24" y="264" width="144" height="28" rx="6" fill="#2563EB"/>
    <text x="96" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">maithresh.pages.dev</text>

    <rect x="178" y="264" width="150" height="28" rx="6" fill="#141821" stroke="#334155" stroke-width="1"/>
    <text x="253" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#CBD5E1" text-anchor="middle">TrustRAG · 835 tests</text>

    <rect x="338" y="264" width="144" height="28" rx="6" fill="#141821" stroke="#202634" stroke-width="1"/>
    <text x="410" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9AA2B1" text-anchor="middle">100% local-first</text>
  </g>

  <!-- Right SPEC // MV-2027 Dossier Plate -->
  <rect x="520" y="70" width="296" height="224" rx="10" fill="#11141B" stroke="#202634" stroke-width="1"/>
  <text x="536" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.8" fill="#848D9C">SPEC // MV-2027</text>
  <rect x="734" y="79" width="68" height="18" rx="9" fill="#162136" stroke="#253C5A" stroke-width="1"/>
  <circle cx="745" cy="88" r="2.5" fill="#60A5FA" class="pulse"/>
  <text x="753" y="91.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600" fill="#93C5FD">SYNCED</text>
  <line x1="520" y1="104" x2="816" y2="104" stroke="#202634" stroke-width="1"/>

  <rect x="534" y="114" width="268" height="72" rx="6" fill="#0B0D11" stroke="#1E2534" stroke-width="1"/>
  <text x="546" y="131" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#60A5FA">$ ./portrait.sh --spec</text>
  <text x="546" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#CBD5E1">HANDLE   MaithreshVaddi-27</text>
  <text x="546" y="163" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#CBD5E1">METHOD   Spec-first · Zero fluff</text>
  <text x="546" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#93C5FD">TARGET   Every claim defensible</text>

  <text x="536" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#848D9C">FOCUS</text>
  <text x="800" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#F4F2ED" text-anchor="end">RAG Reliability · MCP · Backend</text>
  <line x1="536" y1="215" x2="800" y2="215" stroke="#1A202C" stroke-width="1"/>

  <text x="536" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#848D9C">CORE</text>
  <text x="800" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#F4F2ED" text-anchor="end">LangGraph · CrewAI · FastAPI · Qdrant</text>
  <line x1="536" y1="241" x2="800" y2="241" stroke="#1A202C" stroke-width="1"/>

  <text x="536" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#848D9C">LOCAL</text>
  <text x="800" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#F4F2ED" text-anchor="end">ONNX · Ollama · llama.cpp · MLX</text>
  <line x1="536" y1="267" x2="800" y2="267" stroke="#1A202C" stroke-width="1"/>

  <text x="536" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#848D9C">RULE</text>
  <text x="800" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#60A5FA" text-anchor="end">Verify claims, else ABSTAIN</text>
</svg>
